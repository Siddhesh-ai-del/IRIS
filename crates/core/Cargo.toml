[package]
name = "ferro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless core loop for the ferro terminal coding agent"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.6"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
httpmock = "0.8.3"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
