name: ci

# Headless quality gate (stages 7.3/7.4): format, lint, dependency
# audit, the full hermetic test suite — httpmock providers only, no
# network egress and no secrets, so the E2E scenario
# (`crates/cli/tests/scenario.rs`) runs exactly as it does locally —
# plus a release-build smoke test proving the shipped binary stands
# alone. Mirrors `just ci` / `just smoke` in `agent/`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - name: Format (check only)
        run: cargo fmt --all --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Cache cargo-deny binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}

      - name: Dependency audit (cargo-deny)
        run: |
          cargo deny --version 2>/dev/null || cargo install cargo-deny --locked
          cargo deny check

      - name: Test (hermetic — no network, no keys)
        run: cargo test --workspace --all-features

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - name: Single-binary smoke test (release build, clean env)
        run: bash scripts/smoke.sh

  # Stage 8.3+: Windows runs the full suite, split per target so a
  # failure (or hang) is attributable from the completed steps' live
  # logs; the job timeout bounds any future hang. fmt/clippy are
  # host-independent and stay in the Linux job.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - name: Compile all test binaries
        run: cargo test --workspace --all-features --no-run

      - name: Core unit tests (shell, hooks, loop, provider)
        run: cargo test -p iris-core --all-features --lib

      - name: Core process tests (hooks, mcp, checkpoint, commands)
        run: cargo test -p iris-core --all-features --test hooks --test mcp --test checkpoint --test commands

      - name: Core suite (remaining integration)
        run: cargo test -p iris-core --all-features --test agent_loop --test cassettes --test compaction --test dynamic_tools --test redaction --test redaction_corpus --test redaction_props --test telemetry_off

      - name: CLI suite
        run: cargo test -p iris --all-features

      - name: TUI suite
        run: cargo test -p iris-tui --all-features
