name: release

# Build and publish a GitHub Release when a version tag (v*) is pushed.
# Each matrix target runs the same packaging script used locally
# (agent/scripts/package.sh): release build -> standalone smoke test ->
# tarball + sha256. A publish job then re-verifies every checksum and
# uploads all artifacts in one release. Tag only from a green `main`.
# `workflow_dispatch` runs the same builds as a dry run — publish is
# tag-only, so a dispatch exercises the full pipeline (incl. windows)
# without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
        # Git Bash on windows-latest: the steps below are bash.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the workspace version
        if: github.ref_type == 'tag'
        run: |
          pkg="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME#v}" = "$pkg" || {
            echo "tag $GITHUB_REF_NAME != workspace version $pkg" >&2
            exit 1
          }

      - name: Package (build + smoke + tarball + sha256)
        run: |
          # Tag runs release the tag's version; a dry run names its
          # artifacts after the workspace version instead (ref = branch).
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          bash scripts/package.sh "$version" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: agent/dist/*

  publish:
    needs: build
    # Dry runs (workflow_dispatch) stop after the builds.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: cd dist && sha256sum -c *.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "IRIS $GITHUB_REF_NAME" \
            --generate-notes
