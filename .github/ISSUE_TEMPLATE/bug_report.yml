name: Bug report
description: Report a reproducible problem with IRIS.
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Never post API keys, tokens, or `.env` contents here. Redact them first.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the observed behavior.
      placeholder: IRIS crashed with ... when I ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, exact commands and conditions.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, terminal, install method.
      value: |
        - OS:
        - Terminal:
        - Install method:
        - IRIS version / commit:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have redacted all secrets and private code from this report.
          required: true
