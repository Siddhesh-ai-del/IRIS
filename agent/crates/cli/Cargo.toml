[package]
name = "iris"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal-based AI coding agent"
# `cargo run -p iris` keeps meaning the agent, not the test fixture bin.
default-run = "iris"

[[bin]]
name = "iris"
path = "src/main.rs"

# Stage 6.3 test fixture: a fake MCP server spoken over stdio by the
# mcp integration tests. Not shipped — built only under `--all-features`.
[[bin]]
name = "iris-fake-mcp"
path = "src/bin/iris_fake_mcp.rs"
required-features = ["test-fixtures"]

[features]
test-fixtures = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
iris-core = { path = "../core", version = "0.1.0" }
iris-tui = { path = "../tui", version = "0.1.0" }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
httpmock = "0.8.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
