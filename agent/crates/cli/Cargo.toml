[package]
name = "iris"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal-based AI coding agent"

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
iris-core = { path = "../core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
httpmock = "0.8.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
