[package]
name = "iris-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI shell for the iris coding agent (stage 4.x)"

[dependencies]
iris-core = { path = "../core" }
ratatui = "0.30"
ratatui-textarea = "0.9.3"
serde_json = "1.0.151"
# stage 4.6: hunk rendering for the pending-edit diff view
similar = "3.2.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
# default-features off: the `highlight-code` (syntect) default pulls a
# heavy syntax set and swaps the deterministic code styles; the plan
# asks for the fence's language tag, which the plain path renders.
tui-markdown = { version = "0.3.11", default-features = false }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3.34"
# stage 4.6: TUI snapshots via TestBackend
insta = "1.49.0"
tempfile = "3.27.0"
toml = "1.1.6"
