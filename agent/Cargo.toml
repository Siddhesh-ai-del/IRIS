[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.lints.clippy]
all = { level = "warn" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
